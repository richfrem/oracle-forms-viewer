[workspace]
members = [
    "crates/oracle-forms-core",
    "crates/oracle-forms-xml",
    "crates/oracle-forms-binary",
    "crates/oracle-forms-db",
    "crates/oracle-forms-cli",
    "crates/oracle-forms-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Richard Fremmerlid"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/richfrem/oracle-forms-viewer"
homepage = "https://github.com/richfrem/oracle-forms-viewer"
keywords = ["oracle-forms", "fmb", "reverse-engineering", "plsql", "parser"]
categories = ["development-tools", "parser-implementations"]

[workspace.dependencies]
oracle-forms-core = { path = "crates/oracle-forms-core" }
oracle-forms-xml = { path = "crates/oracle-forms-xml" }
oracle-forms-binary = { path = "crates/oracle-forms-binary" }
oracle-forms-db = { path = "crates/oracle-forms-db" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37"
regex = "1.11"
sha2 = "0.10"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
